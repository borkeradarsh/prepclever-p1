<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI Roles Concept Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a skill-tree map. Domains are columns read left to right, foundations first; a side panel teaches the selected concept or role path. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --lane:#E7ECEA; --ink:#14201B; --muted:#5A6964; --line:#CFD8D4;
  --edge:#9AA9A3; --accent:#2B4FC7; --accent-ink:#FFFFFF; --accent-soft:#E2E8FB; --learned:#1D8253; --on-learned:#FFFFFF;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1214; --surface:#151C1F; --lane:#11181A; --ink:#E4ECE8; --muted:#94A39D; --line:#2A363A;
  --edge:#4C5B60; --accent:#88A3FF; --accent-ink:#0B1020; --accent-soft:#1B2545; --learned:#4CC48A; --on-learned:#06150D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1214; --surface:#151C1F; --lane:#11181A; --ink:#E4ECE8; --muted:#94A39D; --line:#2A363A;
  --edge:#4C5B60; --accent:#88A3FF; --accent-ink:#0B1020; --accent-soft:#1B2545; --learned:#4CC48A; --on-learned:#06150D; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:end;gap:12px 24px;justify-content:space-between}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{position:relative}
.search input{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:220px;max-width:100%}

.roles-wrap{overflow-x:auto;margin-top:12px;padding-bottom:2px}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:var(--accent-ink);opacity:.8}

.main{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px}
.stage{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;min-height:0;min-width:0}
#graph{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#graph.dragging{cursor:grabbing}
#vp.anim{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.zoom{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:16px;font-weight:600;display:grid;place-items:center}
.zoom button.fit{font-size:10px;font-family:var(--f-mono)}
.legend{position:absolute;left:10px;bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);max-width:calc(100% - 70px)}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:3px;border:1.5px solid var(--line);background:var(--surface);display:inline-block}
.sw.core{background:var(--accent);border-color:var(--accent)}
.sw.useful{background:var(--accent-soft);border:1.5px dashed var(--accent)}
.sw.none{opacity:.35}
.sw.learned{background:var(--learned);border-color:var(--learned);border-radius:50%;width:10px}
.dotk{font-family:var(--f-mono);letter-spacing:.05em}

/* SVG */
.lane{fill:var(--lane)}
.lane-h{font-family:var(--f-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;fill:var(--muted)}
.edge{fill:none;stroke:var(--edge);stroke-width:1;opacity:.45;transition:opacity .2s}
.edge.off{opacity:.08}
.edge.on{opacity:.7}
.edge.fade{opacity:.05}
.edge.anc{stroke:var(--accent);stroke-width:2;opacity:1;marker-end:url(#arA)}
.edge.dep{stroke:var(--ink);stroke-width:1.4;stroke-dasharray:4 3;opacity:.8;marker-end:url(#arD)}
#arA path{fill:var(--accent)} #arD path{fill:var(--ink)}
.node{cursor:pointer;transition:opacity .2s}
.node rect.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.node text{font-family:var(--f-body);font-size:11.5px;font-weight:600;fill:var(--ink);pointer-events:none}
.node .dot{pointer-events:none}
.node .dot.c2{fill:var(--muted)}
.node .dot.c1{fill:none;stroke:var(--muted);stroke-width:1}
.node .dot.c0{fill:var(--line)}
.node.core rect.box{fill:var(--accent);stroke:var(--accent)}
.node.core text{fill:var(--accent-ink)}
.node.core .dot.c2{fill:var(--accent-ink)}
.node.core .dot.c1{stroke:var(--accent-ink)}
.node.core .dot.c0{fill:var(--accent-ink);opacity:.3}
.node.useful rect.box{fill:var(--accent-soft);stroke:var(--accent);stroke-dasharray:4 3;stroke-width:1.4}
.node.none{opacity:.28}
.node.dim{opacity:.14}
.node.nomatch{opacity:.15}
.node.match rect.box{stroke:var(--ink);stroke-width:2.4;stroke-dasharray:none}
.node.sel{opacity:1}
.node.sel rect.ring{stroke:var(--ink);stroke-width:2;fill:none}
.node rect.ring{fill:none;stroke:none}
.node:hover rect.box{stroke-width:2}
.node:focus{outline:none}
.node:focus-visible rect.ring{stroke:var(--accent);stroke-width:2.5}
.node .check{display:none}
.node.learned .check{display:inline}
.check circle{fill:var(--learned);stroke:var(--surface);stroke-width:2}
.check path{fill:none;stroke:var(--on-learned);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Matrix */
.matrix{position:absolute;inset:0;overflow:auto}
.matrix table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:640px;width:100%}
.matrix th,.matrix td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:center}
.matrix thead th{position:sticky;top:0;background:var(--surface);z-index:2;font-size:11px;font-weight:700;vertical-align:bottom;cursor:pointer;line-height:1.2}
.matrix thead th:first-child{text-align:left;cursor:default;left:0;z-index:3}
.matrix td.nm{text-align:left;position:sticky;left:0;background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;z-index:1}
.matrix td.nm:hover{color:var(--accent)}
.matrix tr.grp td{background:var(--lane);font-family:var(--f-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;position:sticky;left:0}
.matrix .cur{background:var(--accent-soft)}
.matrix thead th.cur{background:var(--accent);color:var(--accent-ink)}
.mdot{display:inline-block;width:10px;height:10px;border-radius:50%}
.mdot.c2{background:var(--accent)}
.mdot.c1{border:1.5px solid var(--accent)}
.mdot.c0{width:4px;height:4px;background:var(--line)}
.matrix tfoot td{font-family:var(--f-mono);font-size:11px;color:var(--muted);position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line)}
.matrix tfoot td:first-child{text-align:left;left:0;z-index:2}
.lm{color:var(--learned);font-weight:700;margin-left:4px}

/* Panel */
.panel{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:auto;min-height:0;min-width:0;padding:18px 18px 22px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.15;margin:4px 0 8px;text-wrap:balance}
.panel h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 6px}
.panel p{margin:0 0 8px;max-width:65ch}
.back{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px;font-weight:600;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.btn.on{background:var(--learned);border-color:var(--learned);color:var(--on-learned)}
.panel ul.topics{margin:0;padding-left:18px}
.panel ul.topics li{margin:2px 0}
.build{background:var(--lane);border-radius:8px;padding:10px 12px}
.res{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.res a{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:baseline;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink)}
.res a:hover{border-color:var(--accent)}
.res a:hover .rti{color:var(--accent)}
.rtype{font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);grid-row:span 2;min-width:62px}
.rti{font-weight:600;font-size:13px;line-height:1.35}
.rhost{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12.5px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.lk:hover{border-color:var(--accent)}
.lk .ok{color:var(--learned);font-weight:700}
.muted{color:var(--muted)}
.rt{width:100%;border-collapse:collapse;font-size:13px}
.rt td{padding:5px 0;border-bottom:1px solid var(--line)}
.rt tr{cursor:pointer}
.rt tr:hover td:first-child{color:var(--accent)}
.rt tr.cur td{font-weight:700}
.rt td:last-child{text-align:right}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.pill.c2{background:var(--accent);color:var(--accent-ink)}
.pill.c1{background:var(--accent-soft);color:var(--accent);border:1px dashed var(--accent)}
.pill.c0{color:var(--muted);font-weight:500}
.bar{height:8px;border-radius:99px;background:var(--lane);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--learned);border-radius:99px;transition:width .3s}
.stat{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rolecards{display:grid;gap:8px;margin-top:10px}
.rc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.rc:hover{border-color:var(--accent)}
.rc b{font-size:14px}
.rc p{font-size:12.5px;color:var(--muted);margin:2px 0 4px}
.path{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
.path li{display:grid;grid-template-columns:22px 22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.path .num{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.path .nm{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:600;font-size:13px;min-width:0}
.path .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.path .nm:hover{color:var(--accent)}
.path li.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.cb.on{background:var(--learned);border-color:var(--learned)}
.cb svg{width:12px;height:12px}
.cb.on path{stroke:var(--on-learned)}
.cb path{stroke:transparent;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted)}

@media (min-width:960px){
  html,body{height:100%}
  body{display:flex;flex-direction:column}
  .main{flex:1;min-height:0}
}
@media (max-width:959px){
  .main{grid-template-columns:minmax(0,1fr)}
  .stage{height:64vh;min-height:380px}
  .roles{flex-wrap:nowrap}
  .search input{width:160px}
  .legend{font-size:11px;gap:8px}
}
@media (prefers-reduced-motion: reduce){
  #vp.anim{transition:none} .edge,.node,.bar i{transition:none}
}
</style>

<header class="top">
  <div class="brand">

<script>
const ROLES=[
 {k:"mle",n:"ML Engineer",d:"Builds, trains and ships models into production systems."},
 {k:"genai",n:"GenAI / LLM Engineer",d:"Builds products on foundation models: prompting, RAG, agents, fine-tuning and evals."},
 {k:"mlops",n:"AI Platform / MLOps",d:"Runs the infrastructure that trains, deploys and monitors models reliably."},
 {k:"dataeng",n:"AI / ML Data Engineer",d:"Builds the pipelines and datasets that models learn from and serve on."},
 {k:"scientist",n:"Data / Applied Scientist",d:"Turns data into decisions and models through statistics, experiments and research."},
 {k:"aibackend",n:"AI Backend / SWE",d:"Integrates AI into product backends: APIs, LLM calls, retrieval and reliability."},
 {k:"architect",n:"AI Architect / Lead",d:"Designs end-to-end AI systems and guides teams on cost, risk and strategy."}
];
const DOMAINS=[
 {k:"math",n:"Math & Stats"},{k:"cs",n:"Programming & CS"},{k:"data",n:"Data"},{k:"ml",n:"Classical ML"},
 {k:"dl",n:"Deep Learning"},{k:"llm",n:"LLMs & GenAI"},{k:"ops",n:"MLOps & Infra"},{k:"lead",n:"Systems & Leadership"}
];
// id, name, domain, prerequisites, role levels (order of ROLES; 2 core, 1 good to know, 0 not needed), description, topics, practice project
const RAW=[
["linalg","Linear Algebra","math","","2100201","Vectors, matrices and the operations on them. Model parameters, embeddings and data batches are all matrices, so this is the language ML is written in.","Vectors, dot products and norms|Matrix multiplication and transposes|Eigenvalues and eigenvectors|SVD and low-rank approximation","Implement PCA from scratch with NumPy using SVD and compare it with scikit-learn."],
["calc","Calculus","math","","2100201","Derivatives, partial derivatives and the chain rule. Backpropagation is the chain rule applied to a computation graph.","Derivatives and partial derivatives|The chain rule|Gradients and Jacobians|Taylor approximations","Hand-derive the gradient of the logistic regression loss, then check it numerically."],
["prob","Probability","math","","2101201","Random variables, distributions and expectation. Models output probabilities, and most losses are built from likelihoods.","Conditional probability and Bayes' rule|Common distributions|Expectation and variance|Maximum likelihood","Simulate a naive Bayes spam filter on a small email dataset."],
["stats","Statistical Inference","math","prob","1101201","Drawing conclusions from samples: estimates, uncertainty and tests. It tells you whether a metric change is real or noise.","Sampling distributions|Confidence intervals|Hypothesis tests and p-values|Bootstrapping","Bootstrap confidence intervals for a model's accuracy on a held-out set."],
["experiment","A/B Testing","math","stats","1101211","Designing controlled experiments to measure the impact of a change on real users. The final word on whether a model ships.","Randomisation units|Power and sample size|Guardrail metrics|Peeking and multiple testing","Write an experiment plan for a new ranking model, including sample size and stopping rules."],
["optim","Optimization","math","calc,linalg","2100201","How models find good parameters: gradient descent and its variants. Explains learning rates, schedules and why training diverges.","Gradient descent and SGD|Momentum, Adam and AdamW|Learning-rate schedules|Convexity and local minima","Train linear regression with your own SGD and plot loss curves for three learning rates."],
["causal","Causal Inference","math","stats,experiment","0000200","Estimating cause and effect when you cannot run an experiment. Used for pricing, policy and uplift questions.","Confounders and DAGs|Difference-in-differences|Propensity scores|Uplift modelling","Estimate the effect of a promotion from observational data using difference-in-differences."],

["python","Python","cs","","2222222","The working language of AI. Every one of the seven roles reads and writes it daily.","Data types, functions and classes|Virtual environments and packaging|Type hints|Comprehensions and generators","Build a small CLI tool with typed functions, a test suite and a pyproject.toml."],
["git","Git & Linux CLI","cs","","2222121","Version control, the shell and remote machines. You will spend real time in a terminal on GPU boxes and CI runners.","Branching, rebasing and pull requests|Shell scripting basics|SSH and remote work|Processes, logs and permissions","Automate a data download and cleanup with a shell script and review it through a pull request."],
["sql","SQL","cs","","1112221","Querying relational data. Most training data and product metrics start life as a SQL query.","Joins and aggregations|Window functions|CTEs and subqueries|Query plans and indexes","Answer ten product questions on a public dataset using window functions."],
["dsa","Data Structures & Algorithms","cs","python","2111121","Complexity, core data structures and classic algorithms. Needed to write code that scales, and to pass interviews.","Big-O analysis|Hash maps, heaps and trees|Graphs and search|Dynamic programming","Implement an LRU cache and a top-k heap, with tests and complexity notes."],
["numpy","NumPy & Pandas","cs","python","2112200","Vectorised numerical computing and tabular data wrangling in Python.","Arrays, broadcasting and vectorisation|DataFrames, groupby and joins|Missing data|Memory and dtypes","Clean and profile a messy one-million-row CSV without Python loops."],
["testing","Testing & Code Quality","cs","python","2222121","Unit, integration and data tests, plus linting and review habits that keep ML code maintainable.","pytest and fixtures|Mocking external services|Linting and formatting|Testing data and model code","Add tests and a linter to an existing notebook-turned-script."],
["api","APIs & Web Services","cs","python","2211022","Designing and building HTTP APIs. Models and LLM features reach users through them.","REST and JSON schemas|FastAPI and Pydantic|Auth and rate limiting|Versioning and errors","Wrap a trained model in a FastAPI service with request validation and health checks."],
["concurrency","Concurrency & Async","cs","dsa","1211021","Running many things at once with threads, processes and async IO. LLM apps spend most of their time waiting on network calls.","asyncio and event loops|Threads vs processes|Queues and backpressure|Timeouts and retries","Call an LLM API for 1,000 prompts concurrently with a rate limiter and retries."],
["systemdesign","System Design","cs","api,dsa","2122022","Designing services that are scalable, reliable and maintainable: caching, queues, databases and their trade-offs.","Load balancing and caching|Queues and event-driven design|Databases and consistency|Availability and failure modes","Design a URL shortener, then a notification service, and write up the trade-offs."],

","https://developers.google.com/tech-writing"],["Article","Paul Graham: Writing, Briefly","https://paulgraham.com/writing44.html"]],"productsense":[["Article","Google: Rules of Machine Learning","https://developers.google.com/machine-learning/guides/rules-of-ml"],["Article","Eugene Yan: How to Write Design Docs for ML Systems","https://eugeneyan.com/writing/ml-design-docs/"],["Article","Google PAIR: People + AI Guidebook","https://pair.withgoogle.com/guidebook/"]],"research":[["Article","S. Keshav: How to Read a Paper (PDF)","https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf"],["Course","Stanford CS197: AI research for beginners","https://cs197.stanford.edu/"],["Video","Yannic Kilcher: paper explainer videos","https://www.youtube.com/@YannicKilcher"]],"mlsysdesign":[["Course","Stanford CS329S: Machine Learning Systems Design","https://stanford-cs329s.github.io/"],["Article","Evidently AI: ML and LLM system design case studies","https://www.evidentlyai.com/ml-system-design"],["Book","Chip Huyen: Designing Machine Learning Systems","https://www.oreilly.com/library/view/designing-machine-learning/9781098107956/"]],"llmsysdesign":[["Article","Eugene Yan: Patterns for Building LLM-based Systems","https://eugeneyan.com/writing/llm-patterns/"],["Article","What We Learned from a Year of Building with LLMs","https://applied-llms.org/"],["Article","Chip Huyen: Building a Generative AI Platform","https://huyenchip.com/2024/07/25/genai-platform.html"]],"responsible":[["Docs","NIST AI Risk Management Framework","https://www.nist.gov/itl/ai-risk-management-framework"],["Docs","EU Artificial Intelligence Act explorer","https://artificialintelligenceact.eu/"],["Paper","Model Cards for Model Reporting","https://arxiv.org/abs/1810.03993"]],"buildvsbuy":[["Article","a16z: Emerging Architectures for LLM Applications","https://a16z.com/emerging-architectures-for-llm-applications/"],["Tool","Artificial Analysis: model quality, price and speed","https://artificialanalysis const RI={};ROLES.forEach((r,i)=>RI[r.k]=i);
const DI={};DOMAINS.forEach((d,i)=>DI[d.k]=i);
const N={};const nodes=RAW.map((a,i)=>{const n={id:a[0],name:a[1],dom:a[2],pre:a[3]?a[3].split(","):[],roles:[...a[4]].map(Number),desc:a[5],topics:a[6].split("|"),build:a[7],links:LINKS[a[0]],i,deps:[]};N[n.id]=n;return n});
nodes.forEach(n=>n.pre.forEach(p=>N[p].deps.push(n.id)));
const lvl=id=>{const n=N[id];if(n.lv!=null)return n.lv;n.lv=n.pre.length?1+Math.max(...n.pre.map(lvl)):0;return n.lv};
nodes.forEach(n=>lvl(n.id));

// Layout
const NW=136,NH=48,COLW=172,ROWH=60,PAD=20,HEAD=34;
const cols=DOMAINS.map(d=>nodes.filter(n=>n.dom===d.k).sort((a,b)=>a.lv-b.lv||a.i-b.i));
cols.forEach((c,ci)=>c.forEach((n,ri)=>{n.col=ci;n.row=ri;n.x=PAD+14+ci*COLW;n.y=PAD+HEAD+ri*ROWH}));
const maxRows=Math.max(...cols.map(c=>c.length));
const W=PAD*2+(DOMAINS.length-1)*COLW+NW+28, H=PAD+HEAD+maxRows*ROWH+PAD-ROWH+NH+14;
const edges=[];nodes.forEach(n=>n.pre.forEach(p=>edges.push({a:p,b:n.id})));

const SVGNS="http://www.w3.org/2000/svg";
const mk=(t,at,parent)=>{const e=document.createElementNS(SVGNS,t);for(const k in at)e.setAttribute(k,at[k]);parent&&parent.appendChild(e);return e};
const $=s=>document.querySelector(s);
const svg=$("#graph"),vp=$("#vp");

DOMAINS.forEach((d,ci)=>{
  const x=PAD+ci*COLW;
  mk("rect",{class:"lane",x,y:PAD,width:NW+28,height:H-PAD*2+6,rx:10},$("#lanes"));
  const t=mk("text",{class:"lane-h",x:x+14,y:PAD+20},$("#lanes"));t.textContent=d.n;
});
function wrap(s,max=19){const L=[""];for(const w of s.split(" ")){const c=L[L.length-1];if(!c)L[L.length-1]=w;else if((c+" "+w).length<=max)L[L.length-1]=c+" "+w;else L.push(w)}return L.slice(0,2)}
edges.forEach(e=>{
  const s=N[e.a],t=N[e.b];let d;
  if(s.col===t.col){const y1=s.y+NH/2,y2=t.y+NH/2,b=10+Math.min(14,(t.row-s.row)*3);d=`M${s.x},${y1} C${s.x-b},${y1} ${t.x-b},${y2} ${t.x},${y2}`}
  else{const x1=s.x+NW,y1=s.y+NH/2,x2=t.x,y2=t.y+NH/2,c=Math.max(24,(x2-x1)*.45);d=`M${x1},${y1} C${x1+c},${y1} ${x2-c},${y2} ${x2},${y2}`}
  e.el=mk("path",{class:"edge",d},$("#edges"));
});
nodes.forEach(n=>{
  const g=mk("g",{class:"node",transform:`translate(${n.x},${n.y})`,tabindex:"0",role:"button","aria-label":n.name},$("#nodes"));
  g.dataset.id=n.id;
  mk("rect",{class:"ring",x:-3,y:-3,width:NW+6,height:NH+6,rx:9},g);
  mk("rect",{class:"box",width:NW,height:NH,rx:7},g);
  const L=wrap(n.name);
  L.forEach((l,i)=>{const t=mk("text",{x:NW/2,y:(L.length===1?23:16)+i*13,"text-anchor":"middle"},g);t.textContent=l});
  n.roles.forEach((v,i)=>{const cx=NW/2-24+i*8,cy=NH-8;mk("circle",{class:"dot c"+v,cx,cy,r:v===0?1.4:2.4},g)});
  const ck=mk("g",{class:"check",transform:`translate(${NW-2},2)`},g);
  mk("circle",{r:7},ck);mk("path",{d:"M-3,0 L-1,2.2 L3,-2.4"},ck);
  n.el=g;
  g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select(n.id,false)}});
  g.addEventListener("pointerenter",ev=>{if(ev.pointerType==="mouse"&&!drag.active){state.hover=n.id;paint()}});
  g.addEventListener("pointerleave",ev=>{if(state.hover===n.id){state.hover=null;paint()}});
});

// State
const KEY="ai-roles-concept-map.v1";
const state={role:"all",sel:null,hover:null,coreOnly:false,view:"graph",q:""};
const learned=new Set();
try{const s=JSON.parse(localStorage.getItem(KEY)||"{}");(s.learned||[]).forEach(id=>N[id]&&learned.add(id));if(s.role&&RI[s.role]!=null)state.role=s.role;if(s.coreOnly)state.coreOnly=true}catch(e){}
const h=(location.hash||"").slice(1);if(RI[h]!=null)state.role=h;else if(N[h])state.sel=h;
function save(){try{localStorage.setItem(KEY,JSON.stringify({learned:[...learned],role:state.role,coreOnly:state.coreOnly}))}catch(e){}}

const lvOf=(n,r=state.role)=>r==="all"?-1:n.roles[RI[r]];
function ancestors(id,acc=new Set()){for(const p of N[id].pre){if(!acc.has(p)){acc.add(p);ancestors(p,acc)}}return acc}
const matchQ=(n,q)=>n.name.toLowerCase().includes(q)||n.topics.some(t=>t.toLowerCase().includes(q))||n.desc.toLowerCase().includes(q);
const roleSet=(k,coreOnly)=>nodes.filter(n=>{const v=n.roles[RI[k]];return coreOnly?v===2:v>0}).sort((a,b)=>a.lv-b.lv||a.col-b.col||a.row-b.row);

function paint(){
  const focus=state.hover||state.sel, q=state.q.trim().toLowerCase();
  let anc=null,deps=null,rel=null;
  if(focus){anc=ancestors(focus);deps=new Set(N[focus].deps);rel=new Set([...anc,focus,...deps])}
  for(const n of nodes){
    const v=lvOf(n),c=n.el.classList,m=q&&matchQ(n,q);
    c.toggle("core",v===2);c.toggle("useful",v===1);c.toggle("none",v===0);
    c.toggle("sel",n.id===state.sel);c.toggle("dim",!!rel&&!rel.has(n.id));
    c.toggle("learned",learned.has(n.id));c.toggle("match",!!m);c.toggle("nomatch",!!q&&!m&&!rel);
  }
  for(const e of edges){
    const c=e.el.classList;let k="";
    if(focus){
      if(anc.has(e.a)&&(e.b===focus||anc.has(e.b)))k="anc";
      else if(e.a===focus)k="dep";else k="fade";
    }else if(state.role!=="all"){k=(lvOf(N[e.a])>0&&lvOf(N[e.b])>0)?"on":"off"}
    else if(q)k="off";
    e.el.setAttribute("class","edge"+(k?" "+k:""));
  }
  // bring highlighted edges to front
  if(focus)edges.forEach(e=>{if(e.el.classList.contains("anc")||e.el.classList.contains("dep"))e.el.parentNode.appendChild(e.el)});
}

function render(){paint();renderChips();renderLegend();renderPanel();if(state.view==="matrix")renderMatrix()}

  el.innerHTML=`<button class="chip" data-role="all" aria-pressed="${state.role==="all"}">All roles</button>`+
   ROLES.map(r=>`<button class="chip" data-role="${r.k}" aria-pressed="${state.role===r.k}">${r.n}<span class="n">${roleSet(r.k,true).length}</span></button>`).join("");
}
$("#roles").addEventListener("click",e=>{const b=e.target.closest("[data-role]");if(b)setRole(b.dataset.role,true)});
function setRole(k,clearSel){
  state.role=k;if(clearSel)state.sel=null;save();
  try{history.replaceState(null,"",k==="all"?location.pathname+location.search:"#"+k)}catch(e){}
  render();
}

  const L=$("#legend");
  if(state.view==="matrix"){L.innerHTML=`<span class="k"><span class="mdot c2"></span>Core</span><span class="k"><span class="mdot c1"></span>Good to know</span><span class="k">Click a row to open it</span>`;return}
  L.innerHTML=state.role==="all"
   ?`<span class="k dotk">●○ · ×7</span><span>Dots show the 7 roles in chip order: ● core, ○ good to know</span><span class="k"><span class="sw learned"></span>Learned</span>`
   :`<span class="k"><span class="sw core"></span>Core</span><span class="k"><span class="sw useful"></span>Good to know</span><span class="k"><span class="sw none"></span>Not needed</span><span class="k"><span class="sw learned"></span>Learned</span>`;
}

// Panel
const CK=`<svg viewBox="0 0 12 12"><path d="M2.5 6.2 L5 8.6 L9.6 3.6"/></svg>`;
const LBL=["Not needed","Good to know","Core"];
function progressFor(k){const s=roleSet(k,true);const d=s.filter(n=>learned.has(n.id)).length;return{d,t:s.length,p:s.length?Math.round(d/s.length*100):0}}
function chip(id){const n=N[id];return `<button class="lk" data-sel="${id}">${learned.has(id)?'<span class="ok">✓</span>':""}${n.name}</button>`}
function renderPanel(){
  const P=$("#panel");
  if(state.sel){
    const n=N[state.sel],r=state.role,on=learned.has(n.id);
    const backTo=r==="all"?"overview":ROLES[RI[r]].n+" path";
    P.innerHTML=`<button class="back" data-back>← Back to ${backTo}</button>
     <p class="eyebrow">${DOMAINS[DI[n.dom]].n}</p>
     <h2>${n.name}</h2>
     <p>${n.desc}</p>
     <div class="row" style="margin-top:10px"><button class="btn ${on?"on":""}" data-learn="${n.id}">${on?"✓ Learned":"Mark as learned"}</button>
     ${r!=="all"?`<span class="pill c${lvOf(n)}">${LBL[lvOf(n)]} for ${ROLES[RI[r]].n}</span>`:""}</div>
     <h3>What to learn</h3><ul class="topics">${n.topics.map(t=>`<li>${t}</li>`).join("")}</ul>
     <h3>Build this</h3><p class="build">${n.build}</p>
     <h3>Top resources</h3><ol class="res">${n.links.map(([t,ti,u])=>`<li><a href="${u}" target="_blank" rel="noopener"><span class="rtype">${t}</span><span class="rti">${ti} ↗</span><span class="rhost">${new URL(u).hostname.replace(/^www\./,"")}</span></a></li>`).join("")}</ol>
     <h3>Learn first</h3>${n.pre.length?`<div class="links">${n.pre.map(chip).join("")}</div>`:`<p class="muted">Nothing. This is a starting point.</p>`}
     <h3>Unlocks</h3>${n.deps.length?`<div class="links">${n.deps.map(chip).join("")}</div>`:`<p class="muted">Nothing further on this map.</p>`}
     <h3>Needed by role</h3>
     <table class="rt">${ROLES.map((ro,i)=>`<tr data-role-keep="${ro.k}" class="${r===ro.k?"cur":""}"><td>${ro.n}</td><td><span class="pill c${n.roles[i]}">${LBL[n.roles[i]]}</span></td></tr>`).join("")}</table>`;
    return;
  }
  if(state.role==="all"){
    P.innerHTML=`<p class="eyebrow">Overview</p><h2>Seven AI roles, one map</h2>
     <p>Each of the ${nodes.length} concepts is tagged Core or Good to know for every role. Arrows run from prerequisites to what they unlock, so columns read left to right from foundations to leadership.</p>
     <p class="hint">Hover a concept to trace its prerequisites. Click it to see what to learn, a project to build and where to start. Your progress is saved in this browser.</p>
     <div class="rolecards">${ROLES.map(r=>{const p=progressFor(r.k),u=roleSet(r.k,false).length-p.t;return `<button class="rc" data-role="${r.k}"><b>${r.n}</b><p>${r.d}</p><div class="bar"><i style="width:${p.p}%"></i></div><span class="stat">${p.t} core · ${u} good to know · ${p.d}/${p.t} core learned</span></button>`}).join("")}</div>`;
    return;
  }
  const r=ROLES[RI[state.role]],p=progressFor(r.k),list=roleSet(r.k,state.coreOnly);
  P.innerHTML=`<p class="eyebrow">Learning path</p><h2>${r.n}</h2><p>${r.d}</p>
   <div class="bar"><i style="width:${p.p}%"></i></div><span class="stat">${p.d} of ${p.t} core concepts learned · ${p.p}%</span>
   <div class="row" style="margin-top:14px"><h3 style="margin:0">${list.length} concepts in order</h3>
   <label class="toggle"><input type="checkbox" id="coreOnly" ${state.coreOnly?"checked":""}> Core only</label></div>
   <p class="hint" style="margin-top:4px">Ordered so prerequisites come first. Concepts outside this role that sit on the way are still shown in the graph.</p>
   <ol class="path">${list.map((n,i)=>{const on=learned.has(n.id),v=n.roles[RI[r.k]];return `<li class="${on?"done":""}"><span class="num">${i+1}</span><button class="cb ${on?"on":""}" data-learn="${n.id}" aria-label="${on?"Unmark":"Mark"} ${n.name} as learned">${CK}</button><button class="nm" data-sel="${n.id}">${n.name}<small>${DOMAINS[DI[n.dom]].n}</small></button><span class="pill c${v}">${v===2?"Core":"Good to know"}</span></li>`}).join("")}</ol>`;
}
$("#panel").addEventListener("click",e=>{
  const t=e.target.closest("[data-sel],[data-learn],[data-role],[data-role-keep],[data-back]");if(!t)return;
  if(t.dataset.learn){const id=t.dataset.learn;learned.has(id)?learned.delete(id):learned.add(id);save();render()}
  else if(t.dataset.sel)select(t.dataset.sel,true);
  else if(t.dataset.roleKeep)setRole(t.dataset.roleKeep,false);
  else if(t.dataset.role)setRole(t.dataset.role,true);
  else if("back" in t.dataset){state.sel=null;render()}
});
$("#panel").addEventListener("change",e=>{if(e.target.id==="coreOnly"){state.coreOnly=e.target.checked;save();renderPanel()}});

function select(id,center){
  state.sel=id;state.hover=null;
  if(state.view!=="graph"){setView("graph")}
  render();if(center)centerOn(id);
  $("#panel").scrollTop=0;
}

// Matrix
function renderMatrix(){
  const ci=state.role==="all"?-1:RI[state.role];
  let html=`<table><thead><tr><th>Concept</th>${ROLES.map((r,i)=>`<th data-role="${r.k}" class="${i===ci?"cur":""}">${r.n.replace(" / ","<br>/ ")}</th>`).join("")}</tr></thead><tbody>`;
  DOMAINS.forEach(d=>{
    html+=`<tr class="grp"><td colspan="8">${d.n}</td></tr>`;
    cols[DI[d.k]].forEach(n=>{html+=`<tr><td class="nm" data-sel="${n.id}">${n.name}${learned.has(n.id)?'<span class="lm">✓</span>':""}</td>${n.roles.map((v,i)=>`<td class="${i===ci?"cur":""}" title="${ROLES[i].n}: ${LBL[v]}"><span class="mdot c${v}"></span></td>`).join("")}</tr>`});
  });
  html+=`</tbody><tfoot><tr><td>Core / good to know</td>${ROLES.map((r,i)=>{const c=nodes.filter(n=>n.roles[i]===2).length,u=nodes.filter(n=>n.roles[i]===1).length;return `<td class="${i===ci?"cur":""}">${c} / ${u}</td>`}).join("")}</tr></tfoot></table>`;
  $("#matrix").innerHTML=html;
}
$("#matrix").addEventListener("click",e=>{const t=e.target.closest("[data-sel],[data-role]");if(!t)return;if(t.dataset.sel)select(t.dataset.sel,true);else setRole(t.dataset.role,false)});
function setView(v){
  state.view=v;$("#vGraph").setAttribute("aria-pressed",v==="graph");$("#vMatrix").setAttribute("aria-pressed",v==="matrix");
  svg.style.visibility=v==="graph"?"visible":"hidden";$("#matrix").hidden=v!=="matrix";$("#zoomCtl").hidden=v!=="graph";
  if(v==="matrix")renderMatrix();renderLegend();
}
$("#vGraph").onclick=()=>{setView("graph")};$("#vMatrix").onclick=()=>{setView("matrix")};

// Search
$("#q").addEventListener("input",e=>{state.q=e.target.value;paint()});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){const q=state.q.trim().toLowerCase();const m=q&&nodes.find(n=>matchQ(n,q));if(m){select(m.id,true)}}if(e.key==="Escape"){e.target.value="";state.q="";paint()}});

// Pan & zoom
const T={x:0,y:0,k:1};
function applyT(anim){vp.classList.toggle("anim",!!anim);vp.style.transform=`translate(${T.x}px,${T.y}px) scale(${T.k})`;if(anim)setTimeout(()=>vp.classList.remove("anim"),480)}
const clampK=k=>Math.min(2.4,Math.max(.25,k));
function fit(anim){const r=svg.getBoundingClientRect();if(!r.width)return;let k=Math.min(r.width/W,(r.height-44)/H,1.15);const narrow=r.width<700;if(narrow)k=Math.max(k,.62);T.k=k;T.x=narrow?0:(r.width-W*k)/2;T.y=narrow?0:Math.max(0,(r.height-44-H*k)/2);applyT(anim)}
function zoomAt(f,cx,cy,anim){const k=clampK(T.k*f);T.x=cx-(cx-T.x)*(k/T.k);T.y=cy-(cy-T.y)*(k/T.k);T.k=k;applyT(anim)}
function centerOn(id){const n=N[id],r=svg.getBoundingClientRect();const k=Math.max(T.k,.85);T.k=k;T.x=r.width/2-(n.x+NW/2)*k;T.y=r.height/2-(n.y+NH/2)*k;applyT(true)}
$("#zIn").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.25,r.width/2,r.height/2,true)};
$("#zOut").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(.8,r.width/2,r.height/2,true)};
$("#zFit").onclick=()=>fit(true);
svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),e.clientX-r.left,e.clientY-r.top)},{passive:false});
const pts=new Map();const drag={active:false,moved:false,node:null,sx:0,sy:0,tx:0,ty:0,pinch:null};
svg.addEventListener("pointerdown",e=>{
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
  if(pts.size===1){drag.active=true;drag.moved=false;drag.node=e.target.closest(".node")?.dataset.id||null;drag.sx=e.clientX;drag.sy=e.clientY;drag.tx=T.x;drag.ty=T.y}
  else if(pts.size===2){const[a,b]=[...pts.values()];drag.pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:T.k,tx:T.x,ty:T.y,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};drag.moved=true}
});
svg.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&drag.pinch){const[a,b]=[...pts.values()],p=drag.pinch,r=svg.getBoundingClientRect();const k=clampK(p.k*Math.hypot(a.x-b.x,a.y-b.y)/p.d);const cx=p.cx-r.left,cy=p.cy-r.top;T.x=cx-(cx-p.tx)*(k/p.k);T.y=cy-(cy-p.ty)*(k/p.k);T.k=k;applyT()}
  else if(pts.size===1&&drag.active){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(!drag.moved&&Math.hypot(dx,dy)>4){drag.moved=true;svg.classList.add("dragging")}if(drag.moved){T.x=drag.tx+dx;T.y=drag.ty+dy;applyT()}}
});
function endPtr(e){
  if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
  if(pts.size===1){const[a]=[...pts.values()];drag.pinch=null;drag.sx=a.x;drag.sy=a.y;drag.tx=T.x;drag.ty=T.y;return}
  if(pts.size===0){svg.classList.remove("dragging");if(!drag.moved&&e.type==="pointerup"){if(drag.node)select(drag.node,false);else if(state.sel){state.sel=null;render()}}drag.active=false;drag.pinch=null}
}
svg.addEventListener("pointerup",endPtr);svg.addEventListener("pointercancel",endPtr);

$("#sub").textContent=`${nodes.length} concepts, ${DOMAINS.length} domains, ${ROLES.length} roles. Pick a role, then click any concept to learn it.`;
render();
requestAnimationFrame(()=>{fit(false);if(state.sel)centerOn(state.sel)});
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>fit(false),150)});
</script>

</body></html>
